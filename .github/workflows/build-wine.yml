name: 构建 Hangover Wine 软件包
run-name: Hangover Wine 软件包 ${{ inputs.request_id || github.run_number }}

on:
  schedule:
    # 每周日北京时间 10:00（UTC 02:00）构建全部平台。
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      build_target:
        description: 构建全部目标，或只替换滚动发布中的一个目标
        required: true
        type: choice
        default: all
        options:
          - all
          - ubuntu2404
          - ubuntu2510
          - ubuntu2604
          - debian13
          - fedora43
          - fedora44
          - arch
      hangover_ref:
        description: 要构建的 Hangover 分支、标签或提交
        required: true
        type: string
        default: main
      hangover_repo:
        description: Hangover Git 仓库地址
        required: true
        type: string
        default: https://github.com/mikugirls/hangover.git
      request_id:
        description: 可选的调用方请求 ID
        required: false
        type: string
        default: ''
      publish_cnb:
        description: 同步发布到 CNB 国内镜像
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: 解析 Hangover 源码
    runs-on: ubuntu-latest
    outputs:
      hangover_commit: ${{ steps.resolve.outputs.hangover_commit }}
      hangover_version: ${{ steps.resolve.outputs.hangover_version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: 生成构建矩阵
        id: targets
        env:
          BUILD_TARGET_INPUT: ${{ inputs.build_target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET_INPUT" in
            all)
              targets='["ubuntu2404","ubuntu2510","ubuntu2604","debian13","fedora43","fedora44","arch"]'
              ;;
            ubuntu2404|ubuntu2510|ubuntu2604|debian13|fedora43|fedora44|arch)
              targets="[\"$BUILD_TARGET_INPUT\"]"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "构建目标：$targets"

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          fi

      - name: 将源码解析为单个提交
        id: resolve
        env:
          HANGOVER_REPO: ${{ inputs.hangover_repo || 'https://github.com/mikugirls/hangover.git' }}
          HANGOVER_REF: ${{ inputs.hangover_ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail

          source_root="$(mktemp -d)"
          source_dir="$source_root/hangover"
          trap 'rm -rf "$source_root"' EXIT
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$HANGOVER_REPO"
          git -C "$source_dir" fetch --quiet --tags origin
          git -C "$source_dir" fetch --quiet origin "$HANGOVER_REF"
          hangover_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          git -C "$source_dir" cat-file -e "${hangover_commit}^{commit}"

          # 忽略滚动软件包标签；只有 hangover-11.16 这类发布标签
          # 才能作为有效的软件包版本基准。
          version="$(git -C "$source_dir" describe --tags --match 'hangover-[0-9]*' \
            "$hangover_commit" 2>/dev/null || true)"
          version="${version#hangover-}"
          if [ -z "$version" ]; then
            version="0~git${hangover_commit:0:12}"
          fi
          case "$version" in
            *[!A-Za-z0-9.+~_-]*)
              echo "解析出的版本包含不支持用于文件名的字符：$version" >&2
              exit 1
              ;;
          esac

          echo "hangover_commit=$hangover_commit" >> "$GITHUB_OUTPUT"
          echo "hangover_version=$version" >> "$GITHUB_OUTPUT"
          echo "已将 $HANGOVER_REPO @ $HANGOVER_REF 解析为 $hangover_commit（$version）"

  dxvk:
    name: 构建并校验 ARM64EC DXVK
    needs: [prepare, runtime-foundation]
    runs-on: ubuntu-latest
    steps:
      - name: 恢复运行库基础镜像缓存
        id: cache
        uses: actions/cache@v6
        with:
          path: foundationubuntu2204.tgz
          key: hangover-runtime-foundation-${{ needs.prepare.outputs.hangover_commit }}

      - name: 导入运行库基础镜像
        shell: bash
        run: docker image load -i foundationubuntu2204.tgz

      - name: 检出 Hangover 使用的 DXVK fork
        uses: actions/checkout@v6
        with:
          repository: mikugirls/dxvk
          ref: main
          fetch-tags: true
          submodules: recursive
          fetch-depth: 16
          path: dxvk-source

      - name: 构建 ARM64EC 和 x32 DXVK
        shell: bash
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/dxvk"
          archive="$RUNNER_TEMP/dxvk.tar.gz"
          mkdir -p "$work_dir"
          version="$(sed -n '1p' dxvk-source/RELEASE 2>/dev/null || true)"
          version="${version#v}"
          if [ -z "$version" ]; then
            version=3.1
          fi
          case "$version" in
            *[!A-Za-z0-9.+~_-]*)
              echo "DXVK 版本包含不支持用于文件名的字符：$version" >&2
              exit 1
              ;;
          esac

          context="$RUNNER_TEMP/dxvk-context"
          rm -rf "$context"
          mkdir -p "$context"
          cp -a dxvk-source "$context/dxvk"
          rm -rf "$context/dxvk/.git"
          cat > "$context/Dockerfile" <<'DXVK_DOCKERFILE'
          FROM foundationubuntu2204

          RUN apt-get update && apt-get install -y --no-install-recommends python3-pip && \
              pip3 install --upgrade meson && \
              rm -rf /var/lib/apt/lists/*

          RUN mkdir -p /opt/dxvk/output
          COPY dxvk/ /opt/dxvk/
          ENV PATH="/opt/bylaws-llvm-mingw-20240929-ucrt-ubuntu-20.04-x86_64/bin:$PATH"
          ARG DXVK_VERSION
          RUN cd /opt/dxvk && ./package-release.sh "$DXVK_VERSION" /opt/dxvk/output
          DXVK_DOCKERFILE

          docker build --build-arg DXVK_VERSION="$version" \
            -f "$context/Dockerfile" -t hangover-dxvk "$context"
          docker run --rm hangover-dxvk \
            cat "/opt/dxvk/output/dxvk-${version}.tar.gz" > "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" --wildcards --strip-components=1 -C "$work_dir" \
            'dxvk-*/arm64ec/*.dll' 'dxvk-*/x32/*.dll'
          install -m 0644 dxvk-source/LICENSE "$work_dir/LICENSE"
          test "$(find "$work_dir/arm64ec" -type f -name '*.dll' | wc -l)" -gt 0
          test "$(find "$work_dir/x32" -type f -name '*.dll' | wc -l)" -gt 0
          printf '%s\n' "$version" > "$work_dir/version"
          echo "ARM64EC DXVK 版本：$version"

      - name: 上传 DXVK 构建资产
        uses: actions/upload-artifact@v6
        with:
          name: hangover-dxvk
          path: ${{ runner.temp }}/dxvk
          if-no-files-found: error
          retention-days: 1

  runtime-foundation:
    name: 构建共享运行库基础镜像
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 恢复运行库基础镜像缓存
        id: cache
        uses: actions/cache@v6
        with:
          path: foundationubuntu2204.tgz
          key: hangover-runtime-foundation-${{ needs.prepare.outputs.hangover_commit }}

      - name: 检出指定源码
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          HANGOVER_REPO: ${{ inputs.hangover_repo || 'https://github.com/mikugirls/hangover.git' }}
          HANGOVER_COMMIT: ${{ needs.prepare.outputs.hangover_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin "$HANGOVER_REPO"
          git -C source fetch --quiet --depth=1 origin "$HANGOVER_COMMIT"
          git -C source checkout --quiet --detach FETCH_HEAD

      - name: 构建并导出基础镜像
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cp source/.packaging/ubuntu2204/Dockerfile "$RUNNER_TEMP/runtime-foundation.Dockerfile"
          docker build -f "$RUNNER_TEMP/runtime-foundation.Dockerfile" \
            -t foundationubuntu2204 "$RUNNER_TEMP"
          docker image save foundationubuntu2204 | gzip -1 > foundationubuntu2204.tgz

  runtime:
    name: 构建 ${{ matrix.component }} 运行库
    needs: [prepare, runtime-foundation]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [libwow64fex, libarm64ecfex, wowbox64]
    steps:
      - name: 释放磁盘空间
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo apt-get clean
          docker system prune -af || true

      - name: 恢复运行库基础镜像缓存
        uses: actions/cache@v6
        with:
          path: foundationubuntu2204.tgz
          key: hangover-runtime-foundation-${{ needs.prepare.outputs.hangover_commit }}

      - name: 导入运行库基础镜像
        shell: bash
        run: docker image load -i foundationubuntu2204.tgz

      - name: 检出指定源码和子模块
        env:
          HANGOVER_REPO: ${{ inputs.hangover_repo || 'https://github.com/mikugirls/hangover.git' }}
          HANGOVER_COMMIT: ${{ needs.prepare.outputs.hangover_commit }}
          COMPONENT: ${{ matrix.component }}
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin "$HANGOVER_REPO"
          git -C source fetch --quiet --depth=1 origin "$HANGOVER_COMMIT"
          git -C source checkout --quiet --detach FETCH_HEAD
          case "$COMPONENT" in
            libwow64fex|libarm64ecfex) submodule=fex ;;
            wowbox64) submodule=box64 ;;
          esac
          git -C source submodule update --init --recursive --depth=1 "$submodule"

      - name: 构建运行库软件包和 DLL
        env:
          COMPONENT: ${{ matrix.component }}
          HOVERSION: ${{ needs.prepare.outputs.hangover_version }}
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/runtime-output"
          mkdir -p "$output"

          case "$COMPONENT" in
            libwow64fex)
              package_dir=fexpe
              source_dir=source/fex
              image=hangover-libwow64fex
              package_name="hangover-libwow64fex_${HOVERSION}_arm64.deb"
              dll_source=/opt/fex/build/Bin/libwow64fex.dll
              dll_name=libwow64fex.dll
              ;;
            libarm64ecfex)
              package_dir=fexpeec
              source_dir=source/fex
              image=hangover-libarm64ecfex
              package_name="hangover-libarm64ecfex_${HOVERSION}_arm64.deb"
              dll_source=/opt/fex/build/Bin/libarm64ecfex.dll
              dll_name=libarm64ecfex.dll
              ;;
            wowbox64)
              package_dir=boxpe
              source_dir=source/box64
              image=hangover-wowbox64
              package_name="hangover-wowbox64_${HOVERSION}_arm64.deb"
              dll_source=/opt/box64/build/wowbox64-prefix/src/wowbox64-build/wowbox64.dll
              dll_name=wowbox64.dll
              rm -rf "$source_dir/debian"
              ;;
          esac

          cp -r "source/.packaging/ubuntu2204/$package_dir/." "$source_dir/"
          cp "$source_dir/LICENSE" "$source_dir/DEBIAN/copyright"
          sed -i "s/HOVERSION/${HOVERSION}/g" \
            "$source_dir/Dockerfile" "$source_dir/DEBIAN/control"
          docker build -t "$image" "$source_dir"
          docker run --rm "$image" cat "/opt/deb/$package_name" > "$output/$package_name"
          docker run --rm "$image" cat "$dll_source" > "$output/$dll_name"
          test -s "$output/$package_name"
          test -s "$output/$dll_name"

      - name: 上传运行库资产
        uses: actions/upload-artifact@v6
        with:
          name: hangover-runtime-${{ matrix.component }}
          path: runtime-output/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: 构建 ${{ matrix.target }} 软件包
    needs: [prepare, runtime, dxvk]
    # Ubuntu 24.04 和 Debian 13 使用仓库中的 x86_64 交叉构建定义；
    # 其余目标在 ARM64 运行器上原生构建。
    runs-on: ${{ (matrix.target == 'ubuntu2404' || matrix.target == 'debian13') && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      HANGOVER_REPO: ${{ inputs.hangover_repo || 'https://github.com/mikugirls/hangover.git' }}
      HANGOVER_COMMIT: ${{ needs.prepare.outputs.hangover_commit }}
      HOVERSION: ${{ needs.prepare.outputs.hangover_version }}
    steps:
      - name: 释放磁盘空间
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: 解析构建目标
        id: target
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_TARGET" in
            ubuntu2404)
              packaging=ubuntu2404; codename=noble; package_type=deb; asset_arch=arm64 ;;
            ubuntu2510)
              packaging=ubuntu2510; codename=questing; package_type=deb; asset_arch=arm64 ;;
            ubuntu2604)
              packaging=ubuntu2604; codename=resolute; package_type=deb; asset_arch=arm64 ;;
            debian13)
              packaging=debian13; codename=trixie; package_type=deb; asset_arch=arm64 ;;
            fedora43)
              packaging=fedora43; codename=fc43; package_type=rpm; asset_arch=aarch64 ;;
            fedora44)
              packaging=fedora43; codename=fc44; package_type=rpm; asset_arch=aarch64 ;;
            arch)
              packaging=arch; codename=arch; package_type=arch; asset_arch=aarch64 ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET" >&2
              exit 1
              ;;
          esac
          {
            echo "packaging=$packaging"
            echo "codename=$codename"
            echo "package_type=$package_type"
            echo "asset_arch=$asset_arch"
          } >> "$GITHUB_OUTPUT"

      - name: 检出指定源码和 Wine
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin "$HANGOVER_REPO"
          git -C source fetch --quiet --depth=1 origin "$HANGOVER_COMMIT"
          git -C source checkout --quiet --detach FETCH_HEAD
          git -C source submodule update --init --recursive --depth=1 wine

      - name: 设置 Wine 默认图形驱动和字体替换
        shell: bash
        run: |
          set -euo pipefail
          wine_inf=source/wine/loader/wine.inf.in
          defaults_file="$RUNNER_TEMP/hangover-wine-defaults.inf"
          updated_inf="$RUNNER_TEMP/wine.inf.in"

          # AddReg flag 2 (NOCLOBBER) preserves values already set by the user.
          cat > "$defaults_file" <<'WINE_DEFAULTS'
          HKCU,Software\Wine\Drivers,"Graphics",2,"wayland,x11"
          HKCU,Software\Wine\Fonts\Replacements,"Arial",2,"Liberation Sans"
          HKCU,Software\Wine\Fonts\Replacements,"Calibri",2,"Carlito"
          HKCU,Software\Wine\Fonts\Replacements,"Cambria",2,"Caladea"
          HKCU,Software\Wine\Fonts\Replacements,"Consolas",2,"Cascadia Code"
          HKCU,Software\Wine\Fonts\Replacements,"Courier New",2,"Liberation Mono"
          HKCU,Software\Wine\Fonts\Replacements,"DengXian",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"FangSong",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"KaiTi",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"Microsoft YaHei",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"Microsoft YaHei UI",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"NSimSun",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"Segoe UI",2,"Selawik"
          HKCU,Software\Wine\Fonts\Replacements,"Segoe UI Variable",2,"Selawik"
          HKCU,Software\Wine\Fonts\Replacements,"SimHei",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"SimSun",2,"Noto Sans CJK SC"
          HKCU,Software\Wine\Fonts\Replacements,"Tahoma",2,"Selawik"
          HKCU,Software\Wine\Fonts\Replacements,"Times New Roman",2,"Liberation Serif"
          WINE_DEFAULTS

          test "$(grep -c '^\[CurrentVersion\]$' "$wine_inf")" -eq 1
          awk -v defaults_file="$defaults_file" '
            BEGIN {
              while ((getline line < defaults_file) > 0) defaults[line] = 1
              close(defaults_file)
            }
            defaults[$0] { next }
            /^\[CurrentVersion\]$/ && !inserted {
              print
              while ((getline line < defaults_file) > 0) print line
              close(defaults_file)
              inserted = 1
              next
            }
            { print }
            END { if (!inserted) exit 1 }
          ' "$wine_inf" > "$updated_inf"
          mv "$updated_inf" "$wine_inf"

          while IFS= read -r registry_default; do
            test "$(grep -Fxc "$registry_default" "$wine_inf")" -eq 1
          done < "$defaults_file"

      - name: 下载共享运行库
        uses: actions/download-artifact@v7
        with:
          pattern: hangover-runtime-*
          path: runtime
          merge-multiple: true

      - name: 下载 DXVK
        uses: actions/download-artifact@v7
        with:
          name: hangover-dxvk
          path: dxvk

      - name: 在目标发行版中构建 Wine
        env:
          PACKAGING: ${{ steps.target.outputs.packaging }}
          PACKAGE_TYPE: ${{ steps.target.outputs.package_type }}
          CODENAME: ${{ steps.target.outputs.codename }}
        shell: bash
        run: |
          set -euo pipefail

          foundation_dockerfile="$RUNNER_TEMP/foundation-${BUILD_TARGET}.Dockerfile"
          cp "source/.packaging/$PACKAGING/Dockerfile" "$foundation_dockerfile"
          if [ "$BUILD_TARGET" = fedora44 ]; then
            sed -i 's/FROM fedora:43/FROM fedora:44/' "$foundation_dockerfile"
          fi
          empty_context="$RUNNER_TEMP/foundation-context"
          mkdir -p "$empty_context"
          docker build -f "$foundation_dockerfile" -t "foundation${BUILD_TARGET}" "$empty_context"

          cp -r "source/.packaging/$PACKAGING/wine/." source/wine/
          sed -i "s/HOVERSION/${HOVERSION}/g" source/wine/Dockerfile
          if [ "$BUILD_TARGET" = fedora44 ]; then
            sed -i \
              -e 's/foundationfedora43/foundationfedora44/' \
              -e 's/_fedora43_/_fedora44_/' \
              source/wine/Dockerfile
          fi

          package_context="source/wine/.hangover-package"
          rm -rf "$package_context"
          mkdir -p "$package_context/dxvk"
          cp -a dxvk/. "$package_context/dxvk/"
          cat > "$package_context/wine-dxvk-wrapper" <<'DXVK_WRAPPER'
          #!/usr/bin/env bash
          set -u

          # Keep the real loader beside /usr/bin/wine. Wine derives
          # ../lib/wine from the executable's actual location.
          real_wine=/usr/bin/wine.real
          dxvk_root=/usr/share/hangover/dxvk
          prefix="${WINEPREFIX:-${HOME:-/tmp}/.wine}"

          if [[ -r "$dxvk_root/version" ]]; then
            version="$(<"$dxvk_root/version")"
            stamp="$prefix/.hangover-dxvk-version"
            installed_version=''
            [[ -r "$stamp" ]] && installed_version="$(<"$stamp")"
            if [[ "$installed_version" != "$version" ]]; then
              system32="$prefix/drive_c/windows/system32"
              syswow64="$prefix/drive_c/windows/syswow64"
              if mkdir -p "$system32" "$syswow64" 2>/dev/null; then
                copy_ok=true
                # Hangover 的 x86_64 应用优先使用 ARM64EC DXVK。
                for dll in "$dxvk_root/arm64ec/"*.dll; do
                  [[ -f "$dll" ]] || continue
                  cp -f "$dll" "$system32/" || copy_ok=false
                done
                for dll in "$dxvk_root/x32/"*.dll; do
                  [[ -f "$dll" ]] || continue
                  cp -f "$dll" "$syswow64/" || copy_ok=false
                done
                if [[ "$copy_ok" == true ]]; then
                  printf '%s\n' "$version" > "$stamp" 2>/dev/null || true
                fi
              else
                printf 'hangover-wine: cannot write DXVK files to %s\n' "$prefix" >&2
              fi
            fi
          fi

          if [[ -z "${WINEDLLOVERRIDES:-}" ]]; then
            export WINEDLLOVERRIDES='d3d8,d3d9,d3d10core,d3d11,dxgi=n,b'
          fi
          exec -a "$0" "$real_wine" "$@"
          DXVK_WRAPPER
          cat > "$package_context/install-dxvk.sh" <<'DXVK_INSTALL'
          #!/usr/bin/env bash
          set -euo pipefail

          package_root="$1"
          install -d "$package_root/usr/share/hangover/dxvk/arm64ec" \
            "$package_root/usr/share/hangover/dxvk/x32" \
            "$package_root/usr/share/licenses/hangover-wine/dxvk" \
            "$package_root/usr/bin"
          cp -a /opt/hangover-dxvk/arm64ec/. "$package_root/usr/share/hangover/dxvk/arm64ec/"
          cp -a /opt/hangover-dxvk/x32/. "$package_root/usr/share/hangover/dxvk/x32/"
          install -m 0644 /opt/hangover-dxvk/version \
            "$package_root/usr/share/hangover/dxvk/version"
          install -m 0644 /opt/hangover-dxvk/LICENSE \
            "$package_root/usr/share/licenses/hangover-wine/dxvk/LICENSE"
          if [[ -f "$package_root/usr/bin/wine" ]]; then
            rm -f "$package_root/usr/bin/wine.real"
            mv "$package_root/usr/bin/wine" "$package_root/usr/bin/wine.real"
            install -m 0755 /opt/hangover-wine-dxvk-wrapper "$package_root/usr/bin/wine"
            if [[ ! -f "$package_root/usr/bin/../lib/wine/aarch64-unix/ntdll.so" ]]; then
              echo 'wine.real cannot resolve ../lib/wine/aarch64-unix/ntdll.so' >&2
              exit 1
            fi
          else
            echo 'wine executable was not found in the package staging directory' >&2
            exit 1
          fi
          DXVK_INSTALL
          chmod 0755 "$package_context/wine-dxvk-wrapper" "$package_context/install-dxvk.sh"
          bash -n "$package_context/wine-dxvk-wrapper" "$package_context/install-dxvk.sh"

          if [ "$PACKAGE_TYPE" = deb ]; then
            package_version="${HOVERSION}~${CODENAME}"
            old_changelog="$RUNNER_TEMP/changelog.old"
            cp source/wine/debian/changelog "$old_changelog"
            {
              echo "hangover-wine (${package_version}) UNRELEASED; urgency=low"
              echo
              echo "  * 为 ${BUILD_TARGET} 自动构建 ${HANGOVER_COMMIT}。"
              echo
              echo " -- Hangover package workflow <noreply@github.com>  $(date -R)"
              echo
              cat "$old_changelog"
            } > source/wine/debian/changelog
            {
              printf '\noverride_dh_auto_install:\n'
              printf '\tdh_auto_install\n'
              printf '\tif [ -x debian/hangover-wine/usr/bin/wine ]; then \\\n'
              printf '\t  /opt/hangover-dxvk-install.sh debian/hangover-wine; \\\n'
              printf '\telif [ -x debian/tmp/usr/bin/wine ]; then \\\n'
              printf '\t  /opt/hangover-dxvk-install.sh debian/tmp; \\\n'
              printf '\telse \\\n'
              printf '\t  echo "wine executable was not found in Debian staging" >&2; exit 1; \\\n'
              printf '\tfi\n'
            } >> source/wine/debian/rules
            sed -i '/^RUN cd \/opt\/wine; dpkg-buildpackage/i COPY .hangover-package/dxvk \/opt\/hangover-dxvk' \
              source/wine/Dockerfile
            sed -i '/^RUN cd \/opt\/wine; dpkg-buildpackage/i COPY .hangover-package/wine-dxvk-wrapper \/opt\/hangover-wine-dxvk-wrapper' \
              source/wine/Dockerfile
            sed -i '/^RUN cd \/opt\/wine; dpkg-buildpackage/i COPY .hangover-package/install-dxvk.sh \/opt\/hangover-dxvk-install.sh' \
              source/wine/Dockerfile
            docker build -t "hangover-wine-${BUILD_TARGET}" source/wine
          else
            native_output="$RUNNER_TEMP/native-package-output/$BUILD_TARGET"
            native_version="${HOVERSION//-/.}"
            rm -rf "$native_output"
            mkdir -p "$package_context/runtime" "$native_output"
            install -m 0644 runtime/libarm64ecfex.dll runtime/libwow64fex.dll runtime/wowbox64.dll \
              "$package_context/runtime/"

            # 上游最后一个 RUN 会额外生成压缩负载。这里改为直接生成原生软件包，
            # 并在不加载大型镜像的情况下导出结果。
            sed -i '/^RUN tar -C \/opt\/package --zstd -cf \/opt\/artifacts\//d' \
              source/wine/Dockerfile

            if [ "$PACKAGE_TYPE" = rpm ]; then
              cat > "$package_context/hangover-wine.spec" <<'RPM_SPEC'
          %global debug_package %{nil}
          %global __os_install_post %{nil}

          Name:           hangover-wine
          Version:        NATIVE_VERSION
          Release:        1.DISTRO_RELEASE
          Summary:        Wine for running Windows ARM64, x86-64, and x86 applications on ARM64
          License:        LGPL-2.1-or-later
          URL:            https://github.com/mikugirls/hangover
          BuildArch:      aarch64
          Provides:       wine
          Conflicts:      wine-core

          %description
          Hangover Wine with FEX and Box64 PE runtime libraries for ARM64 Linux.

          %prep

          %build

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}
          cp -a /opt/package/. %{buildroot}/

          %files
          /usr/*

          %changelog
          * PACKAGE_DATE Hangover package workflow <noreply@github.com> - NATIVE_VERSION-1
          - 自动构建软件包
          RPM_SPEC
              sed -i \
                -e "s/NATIVE_VERSION/$native_version/g" \
                -e "s/DISTRO_RELEASE/$CODENAME/g" \
                -e "s/PACKAGE_DATE/$(LC_ALL=C date '+%a %b %d %Y')/g" \
                "$package_context/hangover-wine.spec"
              cat >> source/wine/Dockerfile <<'RPM_PACKAGE_DOCKERFILE'
          COPY .hangover-package/dxvk /opt/hangover-dxvk
          COPY .hangover-package/wine-dxvk-wrapper /opt/hangover-wine-dxvk-wrapper
          COPY .hangover-package/install-dxvk.sh /opt/hangover-dxvk-install.sh
          RUN /opt/hangover-dxvk-install.sh /opt/package
          COPY .hangover-package/runtime/ /opt/hangover-runtime/
          COPY .hangover-package/hangover-wine.spec /opt/hangover-package/hangover-wine.spec
          RUN install -m 0644 /opt/hangover-runtime/libarm64ecfex.dll /opt/hangover-runtime/libwow64fex.dll /opt/hangover-runtime/wowbox64.dll /opt/package/usr/lib/wine/aarch64-windows/ && \
              dnf install -y --setopt=install_weak_deps=False rpm-build && \
              mkdir -p /opt/rpmbuild/BUILD /opt/rpmbuild/BUILDROOT /opt/rpmbuild/RPMS /opt/rpmbuild/SOURCES /opt/rpmbuild/SPECS /opt/rpmbuild/SRPMS /opt/package-output && \
              rpmbuild --define '_topdir /opt/rpmbuild' -bb /opt/hangover-package/hangover-wine.spec && \
              rpm_file="$(find /opt/rpmbuild/RPMS -type f -name '*.rpm' -print -quit)" && \
              test -n "$rpm_file" && \
              rpm -qp --queryformat '%{NAME} %{ARCH}\n' "$rpm_file" | grep -qx 'hangover-wine aarch64' && \
              cp "$rpm_file" /opt/package-output/
          FROM scratch AS package-output
          COPY --from=0 /opt/package-output/ /
          RPM_PACKAGE_DOCKERFILE
            else
              cat > "$package_context/PKGBUILD" <<'ARCH_PKGBUILD'
          pkgname=hangover-wine
          pkgver=NATIVE_VERSION
          pkgrel=1
          pkgdesc='Wine for running Windows ARM64, x86-64, and x86 applications on ARM64'
          arch=('aarch64')
          url='https://github.com/mikugirls/hangover'
          license=('LGPL-2.1-or-later')
          depends=('alsa-lib' 'fontconfig' 'freetype2' 'gcc-libs' 'glibc' 'gnutls' 'krb5' 'libcups' 'libpulse' 'libx11' 'libxcomposite' 'libxcursor' 'libxi' 'libxinerama' 'libxrandr' 'libxrender' 'libxxf86vm' 'ncurses' 'sdl2-compat' 'vulkan-icd-loader' 'wayland')
          provides=('wine')
          conflicts=('wine')
          options=('!strip' '!debug')

          package() {
            cp -a /opt/package/. "$pkgdir/"
          }
          ARCH_PKGBUILD
              sed -i "s/NATIVE_VERSION/$native_version/g" "$package_context/PKGBUILD"
              cat >> source/wine/Dockerfile <<'ARCH_PACKAGE_DOCKERFILE'
          COPY .hangover-package/dxvk /opt/hangover-dxvk
          COPY .hangover-package/wine-dxvk-wrapper /opt/hangover-wine-dxvk-wrapper
          COPY .hangover-package/install-dxvk.sh /opt/hangover-dxvk-install.sh
          RUN /opt/hangover-dxvk-install.sh /opt/package
          COPY .hangover-package/runtime/ /opt/hangover-runtime/
          COPY .hangover-package/PKGBUILD /opt/hangover-package/PKGBUILD
          RUN install -m 0644 /opt/hangover-runtime/libarm64ecfex.dll /opt/hangover-runtime/libwow64fex.dll /opt/hangover-runtime/wowbox64.dll /opt/package/usr/lib/wine/aarch64-windows/ && \
              useradd -m -s /bin/bash packagebuild && \
              chown -R packagebuild:packagebuild /opt/hangover-package && \
              su -s /bin/bash packagebuild -c 'cd /opt/hangover-package && makepkg --noconfirm --nodeps --force' && \
              mkdir -p /opt/package-output && \
              package_file="$(find /opt/hangover-package -maxdepth 1 -type f -name '*.pkg.tar.*' -print -quit)" && \
              test -n "$package_file" && \
              pacman -Qp "$package_file" | grep -q '^hangover-wine ' && \
              cp "$package_file" /opt/package-output/
          FROM scratch AS package-output
          COPY --from=0 /opt/package-output/ /
          ARCH_PACKAGE_DOCKERFILE
            fi

            DOCKER_BUILDKIT=1 docker build \
              --target package-output \
              --output "type=local,dest=$native_output" \
              source/wine
          fi

      - name: 创建包管理器软件包
        id: package
        env:
          PACKAGE_TYPE: ${{ steps.target.outputs.package_type }}
          CODENAME: ${{ steps.target.outputs.codename }}
          ASSET_ARCH: ${{ steps.target.outputs.asset_arch }}
        shell: bash
        run: |
          set -euo pipefail

          output_root="$RUNNER_TEMP/hangover-wine-packages"
          package_dir="$output_root/$BUILD_TARGET"
          asset_dir="$GITHUB_WORKSPACE/release-assets"
          rm -rf "$output_root" "$asset_dir"
          mkdir -p "$package_dir" "$asset_dir"

          if [ "$PACKAGE_TYPE" = deb ]; then
            wine_name="hangover-wine_${HOVERSION}~${CODENAME}_arm64.deb"
            docker run --rm "hangover-wine-${BUILD_TARGET}" \
              cat "/opt/$wine_name" > "$package_dir/$wine_name"
            cp runtime/*.deb "$package_dir/"

            mapfile -t package_names < <(
              for package in "$package_dir"/*.deb; do
                dpkg-deb -f "$package" Package
              done | sort -u
            )
            expected=(hangover-libarm64ecfex hangover-libwow64fex hangover-wine hangover-wowbox64)
            if [ "${package_names[*]}" != "${expected[*]}" ]; then
              echo "DEB 软件包集合不完整：${package_names[*]}" >&2
              exit 1
            fi
          else
            native_output="$RUNNER_TEMP/native-package-output/$BUILD_TARGET"
            if [ "$PACKAGE_TYPE" = rpm ]; then
              mapfile -t native_files < <(find "$native_output" -type f -name '*.rpm' -print)
            else
              mapfile -t native_files < <(find "$native_output" -type f -name '*.pkg.tar.*' -print)
            fi
            if [ "${#native_files[@]}" -ne 1 ]; then
              echo "应当只生成一个原生软件包，实际找到 ${#native_files[@]} 个。" >&2
              exit 1
            fi
            cp "${native_files[0]}" "$package_dir/"
          fi

          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'target=%s\nhangover_version=%s\nsource_commit=%s\nbuild_time=%s\n' \
            "$BUILD_TARGET" "$HOVERSION" "$HANGOVER_COMMIT" "$build_time" \
            > "$package_dir/.hangover-wine-build-info"
          asset_name="hangover-wine-${BUILD_TARGET}-${HOVERSION}-${ASSET_ARCH}.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$asset_dir/$asset_name" \
            "hangover-wine-packages/$BUILD_TARGET"
          test -s "$asset_dir/$asset_name"
          echo "asset_path=$asset_dir/$asset_name" >> "$GITHUB_OUTPUT"
          echo "已在 $build_time 创建 $asset_name"

      - name: 上传目标软件包归档
        uses: actions/upload-artifact@v6
        with:
          name: hangover-wine-package-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: 更新 Hangover Wine 滚动发布
    needs: [prepare, build]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    concurrency:
      # 构建可以并行执行，但固定滚动发布必须原地串行更新。
      group: hangover-wine-package-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: 检出安装脚本
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: 确保滚动标签存在
        shell: bash
        run: |
          set -euo pipefail
          tag=hangover-wine-packages
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "滚动标签 $tag 已存在。"
          elif git tag "$tag" "$GITHUB_SHA" && git push origin "refs/tags/$tag"; then
            echo "已创建滚动标签 $tag。"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "滚动标签 $tag 已由并发任务创建。"
          else
            echo "无法创建滚动标签 $tag。" >&2
            exit 1
          fi

      - name: 下载新构建的软件包资产
        uses: actions/download-artifact@v7
        with:
          pattern: hangover-wine-package-*
          path: release-assets
          merge-multiple: true

      - name: 创建清单并更新滚动发布
        env:
          GH_TOKEN: ${{ github.token }}
          HANGOVER_REPO: ${{ inputs.hangover_repo || 'https://github.com/mikugirls/hangover.git' }}
          HANGOVER_REF: ${{ inputs.hangover_ref || 'main' }}
          HANGOVER_COMMIT: ${{ needs.prepare.outputs.hangover_commit }}
          HANGOVER_VERSION: ${{ needs.prepare.outputs.hangover_version }}
          BUILD_TARGET_INPUT: ${{ inputs.build_target || 'all' }}
          REQUEST_ID: ${{ inputs.request_id || format('自动-{0}', github.run_id) }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag=hangover-wine-packages
          release_dir="$GITHUB_WORKSPACE/release-assets"
          manifest="$release_dir/hangover-wine-manifest"
          installer="$release_dir/install-hangover-wine.sh"
          targets=(ubuntu2404 ubuntu2510 ubuntu2604 debian13 fedora43 fedora44 arch)
          declare -A assets=()
          declare -A sources=()
          declare -A build_times=()
          updated_targets=()
          reused_targets=()
          unavailable_targets=()
          mkdir -p "$release_dir"

          asset_suffix() {
            case "$1" in
              ubuntu2404|ubuntu2510|ubuntu2604|debian13) printf '%s\n' '-arm64.tar.gz' ;;
              fedora43|fedora44|arch) printf '%s\n' '-aarch64.tar.gz' ;;
              *) return 1 ;;
            esac
          }

          target_label() {
            case "$1" in
              ubuntu2404) printf '%s\n' 'Ubuntu 24.04' ;;
              ubuntu2510) printf '%s\n' 'Ubuntu 25.10' ;;
              ubuntu2604) printf '%s\n' 'Ubuntu 26.04' ;;
              debian13) printf '%s\n' 'Debian 13' ;;
              fedora43) printf '%s\n' 'Fedora 43' ;;
              fedora44) printf '%s\n' 'Fedora 44' ;;
              arch) printf '%s\n' 'Arch Linux' ;;
              *) return 1 ;;
            esac
          }

          local_asset() {
            local target="$1" suffix path
            local -a matches=()
            suffix="$(asset_suffix "$target")"
            while IFS= read -r path; do
              matches+=("${path##*/}")
            done < <(find "$release_dir" -maxdepth 1 -type f \
              -name "hangover-wine-${target}-*${suffix}" -print | sort)
            if [ "${#matches[@]}" -gt 1 ]; then
              echo "本地有多个资产匹配目标 $target。" >&2
              return 2
            fi
            [ "${#matches[@]}" -eq 1 ] || return 1
            printf '%s\n' "${matches[0]}"
          }

          archive_build_time() {
            local archive="$1" target="$2" metadata
            metadata="$(tar -xOzf "$archive" \
              "hangover-wine-packages/$target/.hangover-wine-build-info" 2>/dev/null)" || return 1
            printf '%s\n' "$metadata" | sed -n 's/^build_time=//p' | sed -n '1p'
          }

          release_exists=false
          release_rows=''
          previous_release_time=''
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            release_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.name, .id] | @tsv')"
            previous_release_time="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.published_at // empty')"
          fi

          release_asset() {
            local target="$1" suffix name id
            local -a matches=()
            suffix="$(asset_suffix "$target")"
            while IFS=$'\t' read -r name id; do
              case "$name" in
                "hangover-wine-${target}-"*"${suffix}") matches+=("$name") ;;
              esac
            done <<< "$release_rows"
            if [ "${#matches[@]}" -gt 1 ]; then
              echo "滚动发布中有多个资产匹配目标 $target。" >&2
              return 2
            fi
            [ "${#matches[@]}" -eq 1 ] || return 1
            printf '%s\n' "${matches[0]}"
          }

          for target in "${targets[@]}"; do
            if asset="$(local_asset "$target")"; then
              assets["$target"]="$asset"
              sources["$target"]='new'
              build_times["$target"]="$(archive_build_time "$release_dir/$asset" "$target")"
              updated_targets+=("$target")
            else
              status=$?
              [ "$status" -eq 1 ] || exit "$status"
              if [ "$release_exists" = true ] && asset="$(release_asset "$target")"; then
                assets["$target"]="$asset"
                sources["$target"]='reused'
                build_times["$target"]="${previous_release_time:-unknown}"
                reused_targets+=("$target")
              else
                status=$?
                [ "$status" -eq 1 ] || exit "$status"
                unavailable_targets+=("$target")
              fi
            fi
          done

          if [ "$BUILD_TARGET_INPUT" != all ] && [ "${sources[$BUILD_TARGET_INPUT]:-}" != new ]; then
            echo "所选目标 $BUILD_TARGET_INPUT 没有生成新资产，本次不更新滚动发布。" >&2
            exit 1
          fi

          cp scripts/install-hangover-wine.sh "$installer"
          chmod +x "$installer"
          {
            echo 'format=1'
            echo "release_tag=$release_tag"
            echo "revision=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "hangover_repo=$HANGOVER_REPO"
            echo "hangover_ref=$HANGOVER_REF"
            echo "hangover_commit=$HANGOVER_COMMIT"
            echo "hangover_version=$HANGOVER_VERSION"
            for target in "${targets[@]}"; do
              [ -n "${assets[$target]:-}" ] || continue
              echo "$target=${assets[$target]}"
              echo "${target}_build_time=${build_times[$target]}"
              echo "${target}_source=${sources[$target]}"
            done
          } > "$manifest"

          join_labels() {
            local target result=''
            for target in "$@"; do
              [ -n "$result" ] && result+=', '
              result+="$(target_label "$target")"
            done
            printf '%s' "${result:-无}"
          }

          release_notes="$(cat <<EOF
          自动构建的 ARM64 Hangover Wine 软件包。

          - Hangover 版本：\`$HANGOVER_VERSION\`
          - Hangover 提交：\`$HANGOVER_COMMIT\`
          - 本次新构建：$(join_labels "${updated_targets[@]}")
          - 沿用上一版发布：$(join_labels "${reused_targets[@]}")
          - 当前尚未提供：$(join_labels "${unavailable_targets[@]}")
          - 请求 ID：${REQUEST_ID:-自动-${GITHUB_RUN_ID}}

          内置 DXVK：ARM64EC DLL 自动安装到 Wine 前缀的 system32，x32 DLL 自动安装到 syswow64，并默认启用 native 覆盖。
          每个压缩包只包含一个发行版的软件包。使用 \`install-hangover-wine.sh\` 自动选择、校验，并通过 APT、DNF 或 Pacman 安装匹配的软件包。
          EOF
          )"

          delete_stale_target_assets() {
            local target="$1" keep="$2" suffix name id
            suffix="$(asset_suffix "$target")"
            release_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.name, .id] | @tsv')"
            while IFS=$'\t' read -r name id; do
              case "$name" in
                "hangover-wine-${target}-"*"${suffix}")
                  if [ "$name" != "$keep" ]; then
                    gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
                  fi
                  ;;
              esac
            done <<< "$release_rows"
          }

          if [ "$release_exists" = true ]; then
            if [ "${#updated_targets[@]}" -gt 0 ]; then
              uploads=()
              for target in "${updated_targets[@]}"; do
                uploads+=("$release_dir/${assets[$target]}")
              done
              gh release upload "$release_tag" "${uploads[@]}" \
                --repo "$GITHUB_REPOSITORY" --clobber
            fi
            gh release upload "$release_tag" "$installer" \
              --repo "$GITHUB_REPOSITORY" --clobber
            # 最后上传清单，确保它不会引用尚未上传的软件包资产。
            gh release upload "$release_tag" "$manifest" \
              --repo "$GITHUB_REPOSITORY" --clobber
            for target in "${updated_targets[@]}"; do
              delete_stale_target_assets "$target" "${assets[$target]}"
            done
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --title 'Hangover Wine ARM64 预编译包' \
              --notes "$release_notes" --draft=false --latest=false
          else
            gh release create "$release_tag" "$release_dir"/* \
              --repo "$GITHUB_REPOSITORY" --draft --latest=false \
              --title 'Hangover Wine ARM64 预编译包' \
              --notes "$release_notes"
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --draft=false --latest=false
          fi

          echo "已更新 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag"

      - name: 同步到 CNB 国内镜像
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_cnb }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: bash scripts/publish-cnb-release.sh hangover-wine-packages
