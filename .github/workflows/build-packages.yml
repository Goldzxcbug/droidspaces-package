name: 构建 systemd 257 软件包
run-name: systemd 257 软件包 ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      publish_cnb:
        description: 同步发布到 CNB 国内镜像
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu2604
            image: ubuntu:26.04
            script: scripts/build-deb.sh
          - target: fedora43
            image: fedora:43
            script: scripts/build-rpm.sh
            fedora_version: '43'
          - target: fedora44
            image: fedora:44
            script: scripts/build-rpm.sh
            fedora_version: '44'
          - target: arch
            image: ogarcia/archlinux:latest
            script: scripts/build-arch.sh
    container:
      image: ${{ matrix.image }}
    env:
      TARGET: ${{ matrix.target }}
      FEDORA_VERSION: ${{ matrix.fedora_version }}
    steps:
      - name: 安装检出源码所需工具
        shell: bash
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
          elif command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False ca-certificates git
          else
            pacman -Sy --needed --noconfirm ca-certificates git
          fi

      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 构建并校验软件包
        shell: bash
        run: bash "${{ matrix.script }}"

      - name: 上传软件包
        uses: actions/upload-artifact@v6
        with:
          name: systemd257-${{ matrix.target }}-arm64
          path: out/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布滚动测试版本
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出发布提交
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 确保滚动标签存在
        shell: bash
        run: |
          set -euo pipefail
          tag="systemd257-packages"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已存在。"
          elif git tag "$tag" "$GITHUB_SHA" && \
              git push origin "refs/tags/${tag}"; then
            echo "已创建滚动标签 ${tag}。"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已由并发任务创建。"
          else
            echo "无法确认或创建滚动标签 ${tag}。" >&2
            exit 1
          fi

      - name: 下载全部软件包
        uses: actions/download-artifact@v7
        with:
          pattern: systemd257-*-arm64
          path: release

      - name: 创建各平台发布归档
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-archives
          for target in ubuntu2604 fedora43 fedora44 arch; do
            artifact="systemd257-${target}-arm64"
            test -d "release/${artifact}"
            tar -C "release/${artifact}" -czf "release-archives/${artifact}.tar.gz" .
          done
          (
            cd release-archives
            sha256sum ./*.tar.gz > SHA256SUMS
          )

      - name: 删除上一版滚动发布资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/systemd257-packages" \
              --jq '.id' 2>/dev/null || true
          )"
          if [[ -n "$release_id" ]]; then
            while IFS= read -r asset_id; do
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                --jq '.[].id'
            )
          fi

      - name: 发布测试软件包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: systemd257-packages
          name: systemd 257 ARM64 预编译包
          body: |
            这是面向 Ubuntu 26.04、Fedora 43、Fedora 44 和 Arch Linux ARM
            的滚动 ARM64 测试软件包。所有软件包都使用对应发行版的原生格式构建，
            并包含 Droidspaces Android 旧内核兼容补丁。每个平台归档均包含
            对应的原生软件包、构建清单和校验和。
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-archives/*

      - name: 将滚动标签移动到本次构建
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/systemd257-packages" \
            -f sha="${GITHUB_SHA}" -F force=true

      - name: 同步到 CNB 国内镜像
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_cnb }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: bash scripts/publish-cnb-release.sh systemd257-packages
