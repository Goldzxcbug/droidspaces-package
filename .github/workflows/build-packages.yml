name: Build systemd 257 package families

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu2604
            image: ubuntu:26.04
            script: scripts/build-deb.sh
          - target: fedora43
            image: fedora:43
            script: scripts/build-rpm.sh
            fedora_version: '43'
          - target: fedora44
            image: fedora:44
            script: scripts/build-rpm.sh
            fedora_version: '44'
          - target: arch
            image: ogarcia/archlinux:latest
            script: scripts/build-arch.sh
    container:
      image: ${{ matrix.image }}
    env:
      TARGET: ${{ matrix.target }}
      FEDORA_VERSION: ${{ matrix.fedora_version }}
    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
          elif command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False ca-certificates git
          else
            pacman -Sy --needed --noconfirm ca-certificates git
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and verify package family
        shell: bash
        run: bash "${{ matrix.script }}"

      - name: Upload package family
        uses: actions/upload-artifact@v6
        with:
          name: systemd257-${{ matrix.target }}-arm64
          path: out/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish rolling test release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Ensure rolling tag exists
        shell: bash
        run: |
          set -euo pipefail
          tag="systemd257-packages"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已存在。"
          elif git tag "$tag" "$GITHUB_SHA" && \
              git push origin "refs/tags/${tag}"; then
            echo "已创建滚动标签 ${tag}。"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已由并发任务创建。"
          else
            echo "无法确认或创建滚动标签 ${tag}。" >&2
            exit 1
          fi

      - name: Download all package families
        uses: actions/download-artifact@v7
        with:
          pattern: systemd257-*-arm64
          path: release

      - name: Create per-platform release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-archives
          for target in ubuntu2604 fedora43 fedora44 arch; do
            artifact="systemd257-${target}-arm64"
            test -d "release/${artifact}"
            tar -C "release/${artifact}" -czf "release-archives/${artifact}.tar.gz" .
          done
          (
            cd release-archives
            sha256sum ./*.tar.gz > SHA256SUMS
          )

      - name: Remove previous rolling release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/systemd257-packages" \
              --jq '.id' 2>/dev/null || true
          )"
          if [[ -n "$release_id" ]]; then
            while IFS= read -r asset_id; do
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                --jq '.[].id'
            )
          fi

      - name: Publish test packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: systemd257-packages
          name: systemd 257 package families
          body: |
            Rolling ARM64 test packages for Ubuntu 26.04, Fedora 43,
            Fedora 44, and Arch Linux ARM. Every package family is built
            from native distribution packaging and includes the Droidspaces
            Android old-kernel compatibility patch. Each platform archive
            contains its native package family, manifest, and checksums.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-archives/*

      - name: Move rolling tag to this build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/systemd257-packages" \
            -f sha="${GITHUB_SHA}" -F force=true
