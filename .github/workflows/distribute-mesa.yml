# Mesa 源仓库：https://github.com/lfdevs/mesa-for-android-container
# 上游 Releases：https://github.com/lfdevs/mesa-for-android-container/releases
# 媒体解码源仓库：https://github.com/Yizhou147/droidspaces-media-decode
# 本工作流不修改上游 Mesa 资产内容，仅补充构建上游未提供的 Debian 12 (bookworm) arm64 资产。

name: 分发 Mesa for Android Container
run-name: 分发 Mesa ${{ inputs.upstream_tag || '最新正式 Release' }}

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 可选的上游 mesa-* 正式 Release tag；留空自动选择最新正式 Release；同一版本号只取最新构建
        required: false
        type: string
        default: ''
      publish_cnb:
        description: 同步发布到 CNB 国内镜像
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: distribute-mesa-for-android-container
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: lfdevs/mesa-for-android-container
  UPSTREAM_URL: https://github.com/lfdevs/mesa-for-android-container
  UPSTREAM_RELEASES_URL: https://github.com/lfdevs/mesa-for-android-container/releases
  MEDIA_REPOSITORY: Yizhou147/droidspaces-media-decode
  MEDIA_URL: https://github.com/Yizhou147/droidspaces-media-decode
  DISTRIBUTION_TAG: mesa-for-android-container
  MANIFEST_NAME: mesa-distribution-manifest

jobs:
  resolve:
    name: 解析上游 Release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      mesa_tag: ${{ steps.upstream.outputs.mesa_tag }}
      bookworm_asset: ${{ steps.upstream.outputs.bookworm_asset }}
      media_tag: ${{ steps.upstream.outputs.media_tag }}
      media_driver_asset: ${{ steps.upstream.outputs.media_driver_asset }}
      media_checksums_asset: ${{ steps.upstream.outputs.media_checksums_asset }}
    steps:
      - name: 检出分发脚本
        uses: actions/checkout@v6

      - name: 检查 Mesa 安装器语法
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/tui/install-mesa.sh
          bash -n scripts/tui/droidspaces-tui.sh

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != main ]]; then
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          fi

      - name: 解析上游 Release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail

          meta_dir="$RUNNER_TEMP/mesa-resolve-metadata"
          mkdir -p "$meta_dir"
          mesa_metadata="$meta_dir/mesa-upstream-release.json"
          media_metadata="$meta_dir/media-upstream-release.json"
          [[ -z "$REQUESTED_TAG" || "$REQUESTED_TAG" =~ ^mesa-[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || {
            echo "上游标签必须使用 mesa-* 格式：$REQUESTED_TAG" >&2
            exit 1
          }
          gh api --paginate --slurp "repos/$UPSTREAM_REPOSITORY/releases?per_page=100" | jq -ce --arg requested "$REQUESTED_TAG" '
            def version_number:
              (.tag_name
               | capture("^mesa-(?<version>[0-9]+(?:\\.[0-9]+){1,2})(?:$|[-+])")? | .version)
              // .tag_name;

            add
            | [.[]
               | select(.draft == false and .prerelease == false)
               | select(.tag_name | test("^mesa-[A-Za-z0-9][A-Za-z0-9._+-]*$"))
               | select(any(.assets[]?; .name | startswith("mesa-for-android-container_")))]
            | sort_by(.published_at) | reverse
            | if length == 0 then error("没有找到可分发的 mesa-* Release") else . end
            | . as $all
            | (if $requested == "" then $all[0]
               else (($all | map(.tag_name) | index($requested)) as $index
                 | if $index == null then error("指定版本不在上游正式 Release 中")
                   else $all[$index] end)
               end | version_number) as $anchor_version
            | reduce $all[] as $release
                ({seen: {}, releases: []};
                 ($release | version_number) as $version
                 | if .seen[$version] then .
                   else .seen[$version] = true
                     | .releases += [$release]
                   end)
            | .releases
            | (map(version_number) | index($anchor_version)) as $index
            | .[$index:($index + 3)]
            | if length > 0 then . else error("没有找到可分发的 mesa-* Release") end
          ' > "$meta_dir/mesa-upstream-releases.json"
          jq -c '.[0]' "$meta_dir/mesa-upstream-releases.json" > "$mesa_metadata"
          mesa_tag="$(jq -er '.tag_name' "$mesa_metadata")"
          jq -r '.[].tag_name' "$meta_dir/mesa-upstream-releases.json" > "$meta_dir/mesa-tags.txt"
          echo "可选的上游正式 Release："
          cat "$meta_dir/mesa-tags.txt"

          trixie_asset="$(jq -er '
            [.assets[]?.name | select(startswith("mesa-for-android-container_") and endswith("_debian_trixie_arm64.tar.gz"))]
            | if length == 1 then .[0]
              else error("上游 Release 缺少唯一的 debian_trixie_arm64.tar.gz 资产") end
          ' "$mesa_metadata")"
          bookworm_asset="${trixie_asset%_debian_trixie_arm64.tar.gz}_debian_bookworm_arm64.tar.gz"

          gh api "repos/$MEDIA_REPOSITORY/releases/latest" > "$media_metadata"
          jq -e '
            .draft == false and
            .prerelease == false and
            (.tag_name | type == "string" and length > 0)
          ' "$media_metadata" >/dev/null
          media_asset_names="$(jq -er '
            [
              [.assets[]? | select((.name // "") | test("^msm_drm_drv_video(-[-A-Za-z0-9._+~]+)?\\.so$"))],
              [.assets[]? | select((.name // "") | test("^SHA256SUMS(\\.rel)?$"))]
            ]
            | if (.[0] | length) == 1 and (.[1] | length) == 1 then
                [.[0][0].name, .[1][0].name] | @tsv
              else
                error("媒体解码 Release 缺少唯一的驱动或 SHA256SUMS 资产")
              end
          ' "$media_metadata")"
          IFS=$'\t' read -r media_driver_asset media_checksums_asset <<< "$media_asset_names"
          media_tag="$(jq -er '.tag_name' "$media_metadata")"

          echo "mesa_tag=$mesa_tag" >> "$GITHUB_OUTPUT"
          echo "bookworm_asset=$bookworm_asset" >> "$GITHUB_OUTPUT"
          echo "media_tag=$media_tag" >> "$GITHUB_OUTPUT"
          echo "media_driver_asset=$media_driver_asset" >> "$GITHUB_OUTPUT"
          echo "media_checksums_asset=$media_checksums_asset" >> "$GITHUB_OUTPUT"
          echo "选择 Mesa 上游 Release：$UPSTREAM_RELEASES_URL/tag/$mesa_tag"
          echo "计划构建 Debian 12 资产：$bookworm_asset"
          echo "选择媒体驱动 Release：$MEDIA_URL/releases/tag/$media_tag"
          echo "选择媒体驱动资产：$media_driver_asset"
          echo "选择媒体校验资产：$media_checksums_asset"

      - name: 上传解析元数据
        uses: actions/upload-artifact@v4
        with:
          name: mesa-resolve-metadata
          path: ${{ runner.temp }}/mesa-resolve-metadata
          retention-days: 1

  build-debian-bookworm:
    name: 构建 Debian 12 (bookworm) arm64 Mesa
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: debian:bookworm-slim
      options: --privileged --user root
    steps:
      - name: 安装 Debian 12 编译依赖
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y mesa
          apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils git ccache cmake ninja-build pkg-config flex bison \
            python3-pip python3-mako python3-yaml python3-packaging \
            libxfixes-dev libarchive-dev libva-dev libdrm-dev libglvnd-dev \
            libwayland-dev libwayland-bin libwayland-egl-backend-dev \
            llvm-15-dev libclang-15-dev libclc-15-dev spirv-tools
          # Debian 12 自带 meson 1.0.1，而新版 Mesa 要求 meson >= 1.4.0
          pip3 install --break-system-packages --no-cache-dir 'meson>=1.4.0'
          # Debian 12 自带 wayland-protocols 1.31；Meson unstable-wayland 模块直接查 pkg-config，
          # 安装 wayland-protocols 1.44 到 /usr/local 以提供 fifo-v1 / color-management-v1 等协议
          curl -fsSL https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.44/downloads/wayland-protocols-1.44.tar.xz \
            | tar -xJ -C /tmp
          /usr/local/bin/meson setup /tmp/wayland-protocols-1.44/build /tmp/wayland-protocols-1.44 \
            --prefix=/usr/local -Dtests=false
          ninja -C /tmp/wayland-protocols-1.44/build install
          rm -rf /tmp/wayland-protocols-1.44
          # Debian 12 自带 glslang 12.0.0（要求 >= 12.2）且自带 cmake 3.25.1，
          # 使用 glslang 14.3.0（仅需 cmake >= 3.17.2）编出 glslangValidator
          git clone --depth 1 --branch 14.3.0 https://github.com/KhronosGroup/glslang.git /tmp/glslang
          cmake -S /tmp/glslang -B /tmp/glslang/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_OPT=OFF \
            -DGLSLANG_TESTS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_GLSLANG_BINARIES=ON
          cmake --build /tmp/glslang/build --target glslang-standalone -j"$(nproc)"
          install -m 0755 /tmp/glslang/build/StandAlone/glslang /usr/local/bin/glslang
          ln -sfn /usr/local/bin/glslang /usr/local/bin/glslangValidator
          rm -rf /tmp/glslang
          hash -r
          meson --version
          glslangValidator --version
          PKG_CONFIG_PATH="/usr/local/share/pkgconfig:/usr/local/lib/pkgconfig" pkg-config --modversion wayland-protocols

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: mesa-bookworm-ccache-${{ runner.os }}-${{ runner.arch }}-${{ needs.resolve.outputs.mesa_tag }}-${{ github.run_id }}
          restore-keys: |
            mesa-bookworm-ccache-${{ runner.os }}-${{ runner.arch }}-${{ needs.resolve.outputs.mesa_tag }}-
            mesa-bookworm-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: 配置 ccache
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --zero-stats
          ccache --show-stats

      - name: 检出上游 Mesa 源码
        uses: actions/checkout@v6
        with:
          repository: lfdevs/mesa-for-android-container
          ref: ${{ needs.resolve.outputs.mesa_tag }}
          fetch-depth: 1

      - name: 编译 Mesa (Debian 12 bookworm arm64)
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR=/root/.ccache
          export PATH="/usr/lib/ccache:/usr/local/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/share/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cd "$GITHUB_WORKSPACE"

          meson_opts=(
            --prefix=/usr
            --wrap-mode=default
            -Dplatforms=x11,wayland
            -Dgallium-drivers=freedreno,zink,virgl,llvmpipe
            -Dgallium-va=enabled
            -Dvideo-codecs=all
            -Dvulkan-drivers=freedreno
            -Dvulkan-layers=
            -Degl=enabled
            -Dgles2=enabled
            -Dglvnd=enabled
            -Dglx=dri
            -Dlibunwind=disabled
            -Dintel-rt=disabled
            -Dmicrosoft-clc=disabled
            -Dvalgrind=disabled
            -Dgles1=disabled
            -Dfreedreno-kmds=kgsl
            -Dbuildtype=release
            -Dc_args=-Wno-error=missing-prototypes
          )

          # 兼容不同上游版本的额外 meson 选项
          if grep -q "'termux-va-bridge'" meson.options 2>/dev/null; then
            meson_opts+=(-Dtermux-va-bridge=enabled)
          fi
          if grep -q "'termux-va-wayland-shim'" meson.options 2>/dev/null; then
            meson_opts+=(-Dtermux-va-wayland-shim=enabled)
          fi
          if grep -q "'gallium-mediafoundation'" meson.options 2>/dev/null; then
            meson_opts+=(-Dgallium-mediafoundation=disabled)
          fi

          meson setup build/ "${meson_opts[@]}"
          ninja -C build/
          ccache --show-stats

      - name: 打包 Debian 12 Mesa 资产
        env:
          BOOKWORM_ASSET: ${{ needs.resolve.outputs.bookworm_asset }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/mesa-install-tmp "$RUNNER_TEMP/mesa-bookworm-out"
          mkdir -p /tmp/mesa-install-tmp "$RUNNER_TEMP/mesa-bookworm-out"
          DESTDIR=/tmp/mesa-install-tmp meson install -C build/
          tar -zcf "$RUNNER_TEMP/mesa-bookworm-out/$BOOKWORM_ASSET" -C /tmp/mesa-install-tmp .
          rm -rf /tmp/mesa-install-tmp
          sha256sum "$RUNNER_TEMP/mesa-bookworm-out/$BOOKWORM_ASSET"
          ls -lh "$RUNNER_TEMP/mesa-bookworm-out/$BOOKWORM_ASSET"

      - name: 上传 Debian 12 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mesa-debian-bookworm
          path: ${{ runner.temp }}/mesa-bookworm-out/${{ needs.resolve.outputs.bookworm_asset }}
          retention-days: 1

  distribute:
    name: 更新 Mesa 滚动发布
    needs:
      - resolve
      - build-debian-bookworm
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: 检出分发脚本
        uses: actions/checkout@v6

      - name: 下载解析元数据
        uses: actions/download-artifact@v4
        with:
          name: mesa-resolve-metadata
          path: ${{ runner.temp }}/mesa-resolve-metadata

      - name: 下载 Debian 12 构建产物
        uses: actions/download-artifact@v4
        with:
          name: mesa-debian-bookworm
          path: ${{ runner.temp }}/mesa-bookworm-out

      - name: 下载并校验分发资产
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          MESA_TAG: ${{ needs.resolve.outputs.mesa_tag }}
          BOOKWORM_ASSET: ${{ needs.resolve.outputs.bookworm_asset }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          MEDIA_TAG: ${{ needs.resolve.outputs.media_tag }}
          MEDIA_DRIVER_ASSET: ${{ needs.resolve.outputs.media_driver_asset }}
          MEDIA_CHECKSUMS_ASSET: ${{ needs.resolve.outputs.media_checksums_asset }}
        shell: bash
        run: |
          set -euo pipefail

          meta_dir="$RUNNER_TEMP/mesa-resolve-metadata"
          asset_dir="$RUNNER_TEMP/mesa-distribution-assets"
          mesa_metadata="$meta_dir/mesa-upstream-release.json"
          media_metadata="$meta_dir/media-upstream-release.json"
          bookworm_file="$RUNNER_TEMP/mesa-bookworm-out/$BOOKWORM_ASSET"
          [[ -f "$bookworm_file" ]] || {
            echo "缺少 Debian 12 构建产物：$bookworm_file" >&2
            exit 1
          }
          rm -rf "$asset_dir"
          mkdir -p "$asset_dir"

          patterns=(
            '*_archlinux_arm64.tar'
            '*_debian_trixie_arm64.tar.gz'
            '*_fedora_43_arm64.tar.gz'
            '*_fedora_44_arm64.tar.gz'
            '*_fedora_45_arm64.tar.gz'
            '*_ubuntu_noble_arm64.tar.gz'
            '*_ubuntu_questing_arm64.tar.gz'
            '*_ubuntu_resolute_arm64.tar.gz'
          )
          download_arguments=()
          for pattern in "${patterns[@]}"; do
            download_arguments+=(--pattern "mesa-for-android-container_${pattern}")
          done
          version_index=0
          while IFS= read -r version_tag; do
            version_dir="$RUNNER_TEMP/mesa-version-$version_index"
            mkdir -p "$version_dir"
            jq -c ".[${version_index}]" "$meta_dir/mesa-upstream-releases.json" > "$RUNNER_TEMP/mesa-version-$version_index.json"
            gh release download "$version_tag" \
              --repo "$UPSTREAM_REPOSITORY" \
              --dir "$version_dir" \
              "${download_arguments[@]}"
            version_index=$((version_index + 1))
          done < "$meta_dir/mesa-tags.txt"
          gh release download "$MEDIA_TAG" \
            --repo "$MEDIA_REPOSITORY" \
            --dir "$asset_dir" \
            --pattern "$MEDIA_DRIVER_ASSET" \
            --pattern "$MEDIA_CHECKSUMS_ASSET"
          gh api \
            --header 'Accept: application/vnd.github.raw+json' \
            "repos/$MEDIA_REPOSITORY/contents/LICENSE?ref=$MEDIA_TAG" \
            > "$asset_dir/droidspaces-media-decode-LICENSE"

          shopt -s nullglob
          for pattern in "${patterns[@]}"; do
            latest_mesa_assets=("$RUNNER_TEMP/mesa-version-0/mesa-for-android-container_"$pattern)
            # 手动指定的历史版本可能早于 Fedora 45 资产首次发布。
            if [[ "$pattern" == '*_fedora_45_arm64.tar.gz' && -n "$REQUESTED_TAG" &&
                  ${#latest_mesa_assets[@]} -eq 0 ]]; then
              continue
            fi
            [[ "${#latest_mesa_assets[@]}" -eq 1 ]] || {
              echo "所选版本的 Mesa 资产 $pattern 应匹配一个文件，实际为 ${#latest_mesa_assets[@]} 个。" >&2
              exit 1
            }
          done
          shopt -u nullglob
          media_driver_asset_file="$asset_dir/$MEDIA_DRIVER_ASSET"
          media_checksums_asset_file="$asset_dir/$MEDIA_CHECKSUMS_ASSET"
          [[ -f "$media_driver_asset_file" && \
              -f "$media_checksums_asset_file" && \
              -s "$asset_dir/droidspaces-media-decode-LICENSE" ]]

          verify_upstream_asset() {
            local metadata="$1" file="$2" name row digest expected_size
            local expected_sha actual_sha actual_size
            name="${file##*/}"
            row="$(jq -er --arg name "$name" '
              [.assets[] | select(.name == $name)]
              | if length == 1 then [.[0].digest, .[0].size] | @tsv
                else error("资产不唯一") end
            ' "$metadata")"
            IFS=$'\t' read -r digest expected_size <<< "$row"
            [[ "$digest" =~ ^sha256:([0-9A-Fa-f]{64})$ ]]
            expected_sha="${BASH_REMATCH[1],,}"
            actual_sha="$(sha256sum "$file" | awk '{print $1}')"
            actual_size="$(stat -c '%s' "$file")"
            [[ "$actual_sha" == "$expected_sha" && "$actual_size" == "$expected_size" ]] || {
              echo "上游资产校验失败：$name" >&2
              return 1
            }
          }

          version_index=0
          while IFS= read -r version_tag; do
            version_dir="$RUNNER_TEMP/mesa-version-$version_index"
            mapfile -t version_assets < <(find "$version_dir" -maxdepth 1 -type f -name 'mesa-for-android-container_*' -print | sort)
            ((${#version_assets[@]} > 0 && ${#version_assets[@]} <= ${#patterns[@]})) || {
              echo "版本 $version_tag 的资产数量无效。" >&2; exit 1;
            }
            for asset in "${version_assets[@]}"; do
              verify_upstream_asset "$RUNNER_TEMP/mesa-version-$version_index.json" "$asset"
              [[ ! -e "$asset_dir/${asset##*/}" ]] || { echo "Mesa 附件名称重复：${asset##*/}" >&2; exit 1; }
              cp -- "$asset" "$asset_dir/${asset##*/}"
            done

            # 注入 Debian 12 (bookworm) 资产：当前版本使用本次构建产物，历史版本尽量从现有滚动发布复用
            if (( version_index == 0 )); then
              cp -- "$bookworm_file" "$version_dir/$BOOKWORM_ASSET"
              cp -- "$bookworm_file" "$asset_dir/$BOOKWORM_ASSET"
            else
              hist_trixie="$(jq -r '
                [.assets[]?.name | select(startswith("mesa-for-android-container_") and endswith("_debian_trixie_arm64.tar.gz"))][0] // ""
              ' "$RUNNER_TEMP/mesa-version-$version_index.json")"
              if [[ -n "$hist_trixie" ]]; then
                hist_bookworm="${hist_trixie%_debian_trixie_arm64.tar.gz}_debian_bookworm_arm64.tar.gz"
                if gh release download "$DISTRIBUTION_TAG" \
                    --repo "$GITHUB_REPOSITORY" \
                    --dir "$version_dir" \
                    --pattern "$hist_bookworm" 2>/dev/null && [[ -f "$version_dir/$hist_bookworm" ]]; then
                  cp -- "$version_dir/$hist_bookworm" "$asset_dir/$hist_bookworm"
                  echo "已从现有滚动发布复用历史 Debian 12 资产：$hist_bookworm"
                fi
              fi
            fi

            version_index=$((version_index + 1))
          done < "$meta_dir/mesa-tags.txt"
          verify_upstream_asset "$media_metadata" "$media_driver_asset_file"
          verify_upstream_asset "$media_metadata" "$media_checksums_asset_file"

          # 保持分发 Release 的稳定文件名，兼容安装器和已有客户端；上游
          # 现在会在驱动和校验文件名中携带版本信息。
          if [[ "$MEDIA_DRIVER_ASSET" != msm_drm_drv_video.so ]]; then
            mv -- "$media_driver_asset_file" "$asset_dir/msm_drm_drv_video.so"
          fi
          normalized_checksums="$asset_dir/.SHA256SUMS.normalized"
          awk -v source="$MEDIA_DRIVER_ASSET" -v target=msm_drm_drv_video.so '
            $2 == source { $2 = target; matches += 1 }
            { print }
            END { exit matches == 1 ? 0 : 1 }
          ' "$media_checksums_asset_file" > "$normalized_checksums" || {
            echo "媒体校验文件中没有唯一的 $MEDIA_DRIVER_ASSET 条目。" >&2
            exit 1
          }
          mv -- "$normalized_checksums" "$asset_dir/SHA256SUMS"
          if [[ "$MEDIA_CHECKSUMS_ASSET" != SHA256SUMS ]]; then
            rm -- "$media_checksums_asset_file"
          fi

          [[ -f "$asset_dir/msm_drm_drv_video.so" && \
              -f "$asset_dir/SHA256SUMS" && \
              "$(awk '$2 == "msm_drm_drv_video.so" { count += 1 } END { print count + 0 }' \
                "$asset_dir/SHA256SUMS")" == 1 ]]

          install -m 0755 scripts/tui/install-mesa.sh "$asset_dir/install-mesa.sh"
          versions_manifest="$asset_dir/mesa-versions-manifest"
          {
            printf 'format=1\nrelease_tag=%s\n' "$DISTRIBUTION_TAG"
            printf 'generated_at=%s\n\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'sha256\tsize\tasset\n'
            version_index=0
            while IFS= read -r version_tag; do
              version_dir="$RUNNER_TEMP/mesa-version-$version_index"
              while IFS= read -r -d '' asset; do
                printf '%s\t%s\t%s\n' \
                  "$(sha256sum "$asset" | awk '{print $1}')" \
                  "$(stat -c '%s' "$asset")" "${asset##*/}"
              done < <(find "$version_dir" -maxdepth 1 -type f -name 'mesa-for-android-container_*' -print0 | sort -z)
              version_index=$((version_index + 1))
            done < "$meta_dir/mesa-tags.txt"
          } > "$versions_manifest"

          manifest="$asset_dir/$MANIFEST_NAME"
          {
            printf 'format=1\nrelease_tag=%s\n' "$DISTRIBUTION_TAG"
            printf 'source_repository=%s\n' "$UPSTREAM_URL"
            printf 'source_release=%s/tag/%s\n' "$UPSTREAM_RELEASES_URL" "$MESA_TAG"
            printf 'source_tag=%s\n' "$MESA_TAG"
            printf 'media_repository=%s\n' "$MEDIA_URL"
            printf 'media_release=%s/releases/tag/%s\n' "$MEDIA_URL" "$MEDIA_TAG"
            printf 'media_tag=%s\n' "$MEDIA_TAG"
            printf 'generated_at=%s\n\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'sha256\tsize\tasset\n'
            while IFS= read -r -d '' asset; do
              name="${asset##*/}"
              if [[ "$name" == mesa-for-android-container_* ]] && \
                 [[ "$name" != "$BOOKWORM_ASSET" ]] && \
                 ! jq -e --arg name "$name" 'any(.assets[]?; .name == $name)' "$mesa_metadata" >/dev/null; then
                continue
              fi
              printf '%s\t%s\t%s\n' \
                "$(sha256sum "$asset" | awk '{print $1}')" \
                "$(stat -c '%s' "$asset")" "$name"
            done < <(find "$asset_dir" -maxdepth 1 -type f ! -name "$MANIFEST_NAME" -print0 | sort -z)
          } > "$manifest"

          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"
          echo "已准备 $(find "$asset_dir" -maxdepth 1 -type f | wc -l) 个分发附件。"

      - name: 确保滚动标签存在
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$DISTRIBUTION_TAG" >/dev/null 2>&1; then
            echo "滚动标签 $DISTRIBUTION_TAG 已存在。"
          elif git tag "$DISTRIBUTION_TAG" "$GITHUB_SHA" && \
              git push origin "refs/tags/$DISTRIBUTION_TAG"; then
            echo "已创建滚动标签 $DISTRIBUTION_TAG。"
          elif git ls-remote --exit-code --tags origin "refs/tags/$DISTRIBUTION_TAG" >/dev/null 2>&1; then
            echo "滚动标签 $DISTRIBUTION_TAG 已由并发任务创建。"
          else
            echo "无法创建滚动标签 $DISTRIBUTION_TAG。" >&2
            exit 1
          fi

      - name: 更新 GitHub 滚动发布
        env:
          GH_TOKEN: ${{ github.token }}
          MESA_TAG: ${{ needs.resolve.outputs.mesa_tag }}
          MEDIA_TAG: ${{ needs.resolve.outputs.media_tag }}
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        shell: bash
        run: |
          set -euo pipefail

          release_body="$RUNNER_TEMP/mesa-release-body.md"
          cat > "$release_body" <<EOF
          Mesa 源仓库：[$UPSTREAM_URL]($UPSTREAM_URL)

          媒体解码源仓库：[$MEDIA_URL]($MEDIA_URL)

          对应上游 Release：[$MESA_TAG]($UPSTREAM_RELEASES_URL/tag/$MESA_TAG)

          本 Release 对上游正式 Release 按版本号去重，每个版本号只保留最新一次构建，并保留所选版本及其之前最多两个不同版本号的 Mesa 资产，同时补充构建 Debian 12 (bookworm) arm64 资产。媒体解码驱动独立保留最新版本 $MEDIA_TAG，并可单独安装；许可证随附件提供。

          安装脚本：

          \`\`\`bash
          bash install-mesa.sh --1  # GitHub
          bash install-mesa.sh --2  # gh-proxy.com
          bash install-mesa.sh --3  # CNB
          \`\`\`

          固定滚动地址：[$GITHUB_REPOSITORY Releases](https://github.com/$GITHUB_REPOSITORY/releases/tag/$DISTRIBUTION_TAG)
          EOF

          if ! gh release view "$DISTRIBUTION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$DISTRIBUTION_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mesa for Android Container ($MESA_TAG)" \
              --notes-file "$release_body" \
              --draft \
              --latest=false
          fi

          mapfile -t uploads < <(find "$ASSET_DIR" -maxdepth 1 -type f -print | sort)
          [[ "${#uploads[@]}" -gt 0 ]]
          gh release upload "$DISTRIBUTION_TAG" "${uploads[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

          expected_names="$RUNNER_TEMP/mesa-expected-assets.txt"
          printf '%s\n' "${uploads[@]##*/}" | sort -u > "$expected_names"
          release_json="$RUNNER_TEMP/mesa-distribution-release.json"
          # releases/tags does not expose draft releases. Search the release
          # list so the initial draft can be cleaned before it is published.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -ce \
            --arg tag "$DISTRIBUTION_TAG" '
              [.[] | select(.tag_name == $tag)]
              | if length == 1 then .[0]
                else error("滚动标签对应的 Release 不唯一") end
            ' > "$release_json"
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" && -n "$asset_name" ]] || continue
            if ! grep -Fqx "$asset_name" "$expected_names"; then
              echo "删除旧分发附件：$asset_name"
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' "$release_json")

          gh release edit "$DISTRIBUTION_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mesa for Android Container ($MESA_TAG)" \
            --notes-file "$release_body" \
            --draft=false \
            --prerelease=false \
            --latest=false

      - name: 同步到 CNB
        if: ${{ inputs.publish_cnb }}
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CNB_REPO,,}" == "goldzxcbug/droidspaces-package" ]] || {
            echo "GitHub Actions Variable CNB_REPO 必须是 goldzxcbug/droidspaces-package。" >&2
            exit 1
          }
          bash scripts/publish-cnb-release.sh "$DISTRIBUTION_TAG"
