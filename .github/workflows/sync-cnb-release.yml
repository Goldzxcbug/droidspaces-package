name: 同步 GitHub Release 到 CNB
run-name: 同步 Release ${{ inputs.release_tag }} 到 CNB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要同步到 CNB 的 GitHub Release tag
        required: true
        type: string
        default: winefonts

permissions:
  contents: read

concurrency:
  group: sync-cnb-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出同步脚本
        uses: actions/checkout@v6

      - name: 校验同步参数
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "不支持的 Release tag：$RELEASE_TAG" >&2
            exit 1
          }
          [[ -n "$CNB_TOKEN" ]] || {
            echo "缺少 GitHub Actions Secret：CNB_TOKEN" >&2
            exit 1
          }
          [[ "$CNB_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "缺少或无效的 GitHub Actions Variable：CNB_REPO" >&2
            exit 1
          }

      - name: 同步 Release 到 CNB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/publish-cnb-release.sh "$RELEASE_TAG"
