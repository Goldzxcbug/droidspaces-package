name: 发布 Droidspaces TUI
run-name: 更新 Gold-bug-tui 滚动发布

on:
  workflow_dispatch:
    inputs:
      publish_cnb:
        description: 同步发布到 CNB 国内镜像
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-gold-bug-tui
  cancel-in-progress: false

env:
  RELEASE_TAG: Gold-bug-tui
  MANIFEST_NAME: Gold-bug-tui-manifest

jobs:
  publish:
    name: 发布 TUI 与受管脚本
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: 检出发布源
        uses: actions/checkout@v6

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == main ]] || {
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          }

      - name: 运行脚本语法与 shellcheck 静态检查
        shell: bash
        run: |
          set -euo pipefail

          # 存量脚本仍包含风格类告警（SC2034/SC2043/SC2155 等），这里只以
          # -S error 阻断真正的错误，避免 CI 因既有风格问题变红。
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

          source_dir="$GITHUB_WORKSPACE/scripts/tui"
          bash -n scripts/package-tui.sh
          shellcheck -S error scripts/package-tui.sh
          mapfile -t scripts < <(
            find "$source_dir" -type f -name '*.sh' -printf '%P\n' | sort
          )
          ((${#scripts[@]} >= 3)) || {
            echo "scripts/tui 中的脚本数量异常。" >&2
            exit 1
          }
          for script_name in "${scripts[@]}"; do
            bash -n "$source_dir/$script_name"
            shellcheck -S error -x "$source_dir/$script_name"
          done
          echo "shellcheck 检查通过（${#scripts[@]} 个脚本）。"

      - name: 校验包锁配置写入约定
        shell: bash
        run: |
          set -euo pipefail

          # 共用函数只维护一份；保留 DNF 对已有 excludepkgs= 行合并的约定。
          source_dir="$GITHUB_WORKSPACE/scripts/tui"
          for file in "$source_dir/lib/anland-common.sh" "$source_dir/install-mesa.sh"; do
            grep -q 'function merge_excludes(' "$file" || {
              echo "$file 的 DNF 托管写入未并入用户已有的 excludepkgs= 行。" >&2
              exit 1
            }
          done
          grep -q '^write_pacman_hold_block() {' "$source_dir/lib/anland-common.sh"
          grep -q '^remove_pacman_hold_entries() {' "$source_dir/lib/anland-common.sh"

      - name: 准备压缩包、引导器与发布清单
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="$RUNNER_TEMP/droidspaces-tui-release"
          rm -rf -- "$asset_dir"
          bash scripts/package-tui.sh --output "$asset_dir" --revision "$GITHUB_SHA"
          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"

      - name: 更新 GitHub 滚动发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
        run: |
          set -euo pipefail

          release_notes="$RUNNER_TEMP/droidspaces-tui-release-notes.md"
          managed_scripts="$(
            find "$GITHUB_WORKSPACE/scripts/tui" -maxdepth 1 -type f -name 'install-*.sh' \
              ! -name 'install-tui.sh' -printf '%f\n' | sort | \
              while IFS= read -r script_name; do
                printf -- '- `%s`\n' "$script_name"
              done
          )"
          cat > "$release_notes" <<EOF
          Droidspaces TUI 与受管安装脚本的固定标签滚动发布。

          - 标签：\`$RELEASE_TAG\`
          - 提交：\`$GITHUB_SHA\`
          - TUI 安装后命令：\`droidspaces-tui\`、\`dstui\` 或 \`ds-tui\`
          - 脚本与共享库：\`Gold-bug-tui.tar.gz\`，解压得到 \`tui/\` 目录
          - 旧 RootFS 一次性安装器：\`install-tui.sh\`（不会常驻容器）

          当前受管脚本：

          $managed_scripts

          GitHub/代理模式使用 GitHub Release API 与 \`$MANIFEST_NAME\` 交叉校验；CNB 模式只访问 CNB，同步后的 \`$MANIFEST_NAME\` 提供附件 SHA-256 与大小校验。
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "滚动 Release 已存在。"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Droidspaces TUI 滚动发布' \
              --notes-file "$release_notes" \
              --draft --latest=false
          fi

          release_assets=("$ASSET_DIR/Gold-bug-tui.tar.gz" "$ASSET_DIR/install-tui.sh")
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # 清单最后上传，避免它提前引用尚未就绪的压缩包或引导器。
          gh release upload "$RELEASE_TAG" "$ASSET_DIR/$MANIFEST_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber

          declare -A expected_assets=()
          for asset_path in "${release_assets[@]}" "$ASSET_DIR/$MANIFEST_NAME"; do
            expected_assets["${asset_path##*/}"]=1
          done
          release_json="$RUNNER_TEMP/droidspaces-tui-release.json"
          load_release_json() {
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
                > "$release_json" 2>/dev/null; then
              return
            fi
            # releases/tags 不返回 draft；首次发布时从最新列表中定位。
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -ce \
              --arg tag "$RELEASE_TAG" '
                [.[] | select(.tag_name == $tag)]
                | if length == 1 then .[0]
                  else error("滚动标签对应的 Release 不唯一") end
              ' > "$release_json"
          }
          load_release_json
          while IFS=$'\t' read -r asset_name asset_id; do
            [[ -n "$asset_name" && -n "$asset_id" ]] || continue
            if [[ -z "${expected_assets[$asset_name]:-}" ]]; then
              echo "删除旧附件：$asset_name"
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < <(jq -r '.assets[] | [.name, .id] | @tsv' "$release_json")

          verify_release_assets() {
            local asset_path asset_name row expected_sha expected_size
            local digest published_size
            [[ "$(jq '.assets | length' "$release_json")" == "${#expected_assets[@]}" ]] || return 1
            for asset_path in "${release_assets[@]}" "$ASSET_DIR/$MANIFEST_NAME"; do
              asset_name="${asset_path##*/}"
              row="$(jq -er --arg name "$asset_name" '
                [.assets[] | select(.name == $name)]
                | if length == 1 then [.[0].digest, .[0].size] | @tsv
                  else error("附件缺失或不唯一") end
              ' "$release_json")" || return 1
              IFS=$'\t' read -r digest published_size <<< "$row"
              [[ "$digest" =~ ^sha256:([0-9A-Fa-f]{64})$ ]] || return 1
              expected_sha="$(sha256sum "$asset_path" | awk '{print $1}')"
              expected_size="$(stat -c '%s' "$asset_path")"
              [[ "${BASH_REMATCH[1],,}" == "$expected_sha" && \
                 "$published_size" == "$expected_size" ]] || return 1
            done
          }

          verified=false
          for attempt in {1..10}; do
            load_release_json
            if verify_release_assets; then
              verified=true
              break
            fi
            echo "等待 GitHub 生成附件摘要（$attempt/10）..."
            sleep 2
          done
          [[ "$verified" == true ]] || {
            echo "GitHub Release 附件摘要验证失败。" >&2
            exit 1
          }

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Droidspaces TUI 滚动发布' \
            --notes-file "$release_notes" \
            --draft=false --latest=false
          echo "已更新 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

      - name: 同步到 CNB 国内镜像
        if: ${{ inputs.publish_cnb }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: bash scripts/publish-cnb-release.sh "$RELEASE_TAG"
