name: 临时测试 CNB 三路并行上传
run-name: CNB 三路并行上传测试 ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnb-parallel-upload-test
  cancel-in-progress: false

jobs:
  test-parallel-upload:
    name: 并行上传三个 Wine 软件包
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 下载三个现有 Wine Release 附件
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE_TAG: hangover-wine-packages
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="$RUNNER_TEMP/cnb-parallel-assets"
          release_json="$RUNNER_TEMP/github-release.json"
          asset_list="$RUNNER_TEMP/cnb-parallel-assets.txt"
          mkdir -p "$asset_dir"

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_RELEASE_TAG" \
            > "$release_json"
          jq -r '
            .assets[].name
            | select(test("^hangover-wine-(arch|debian13|fedora43)-.*-(arm64|aarch64)\\.tar\\.gz$"))
          ' "$release_json" | sort > "$asset_list"

          if [ "$(wc -l < "$asset_list")" -ne 3 ]; then
            echo "没有准确找到 Arch、Debian 13、Fedora 43 三个 Wine 附件。" >&2
            cat "$asset_list" >&2
            exit 1
          fi

          while IFS= read -r asset_name; do
            echo "正在下载测试附件：$asset_name"
            gh release download "$SOURCE_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset_name" \
              --dir "$asset_dir"
          done < "$asset_list"

          du -h "$asset_dir"/*

      - name: 同时上传三个附件并清理测试 Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          CNB_API_URL: https://api.cnb.cool
        shell: bash
        run: |
          set -euo pipefail

          : "${CNB_TOKEN:?缺少 CNB_TOKEN}"
          : "${CNB_REPO:?缺少 CNB_REPO}"

          readonly TEST_RELEASE_TAG=cnb-parallel-upload-test
          readonly ASSET_DIR="$RUNNER_TEMP/cnb-parallel-assets"
          readonly ASSET_LIST="$RUNNER_TEMP/cnb-parallel-assets.txt"
          readonly API_REPO="$CNB_API_URL/$CNB_REPO"
          readonly AUTH_HEADER="Authorization: Bearer $CNB_TOKEN"
          readonly ACCEPT_HEADER='Accept: application/vnd.cnb.api+json'

          work_dir="$(mktemp -d)"
          release_id=''

          request() {
            local method="$1"
            local url="$2"
            local expected_statuses="$3"
            local output_file="$4"
            local body_file="${5:-}"
            local status
            local -a arguments=(
              --silent
              --show-error
              --request "$method"
              --header "$AUTH_HEADER"
              --header "$ACCEPT_HEADER"
              --output "$output_file"
              --write-out '%{http_code}'
            )

            if [ -n "$body_file" ]; then
              arguments+=(
                --header 'Content-Type: application/json'
                --data-binary "@$body_file"
              )
            fi

            status="$(curl "${arguments[@]}" "$url")"
            case ",$expected_statuses," in
              *",$status,"*) ;;
              *)
                echo "CNB API 请求失败：$method $url（HTTP $status）" >&2
                jq . "$output_file" 2>/dev/null || sed -n '1,80p' "$output_file" >&2
                return 1
                ;;
            esac
          }

          delete_release() {
            local status
            [ -n "$release_id" ] || return 0
            echo "正在删除 CNB 并行上传测试 Release：$TEST_RELEASE_TAG"
            status="$(curl --silent --show-error \
              --request DELETE \
              --header "$AUTH_HEADER" \
              --header "$ACCEPT_HEADER" \
              --output "$work_dir/delete-response.json" \
              --write-out '%{http_code}' \
              "$API_REPO/-/releases/$release_id" || true)"
            case "$status" in
              200|204|404) echo "已清理 CNB 测试 Release。" ;;
              *) echo "清理 CNB 测试 Release 失败（HTTP ${status:-未知}）。" >&2 ;;
            esac
          }

          cleanup() {
            set +e
            delete_release
            rm -rf -- "$work_dir"
          }
          trap cleanup EXIT

          existing_response="$work_dir/existing-release.json"
          existing_status="$(curl --silent --show-error \
            --request GET \
            --header "$AUTH_HEADER" \
            --header "$ACCEPT_HEADER" \
            --output "$existing_response" \
            --write-out '%{http_code}' \
            "$API_REPO/-/releases/tags/$TEST_RELEASE_TAG")"
          case "$existing_status" in
            200)
              old_release_id="$(jq -er '.id' "$existing_response")"
              echo "正在清理上一次遗留的测试 Release。"
              request DELETE \
                "$API_REPO/-/releases/$old_release_id" \
                '200,204' \
                "$work_dir/delete-old-release.json"
              ;;
            404) ;;
            *)
              echo "读取 CNB 测试 Release 失败（HTTP $existing_status）。" >&2
              exit 1
              ;;
          esac

          jq -n \
            --arg tag "$TEST_RELEASE_TAG" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              tag_name:$tag,
              target_commitish:"main",
              name:"CNB 三路并行上传临时测试",
              body:("临时速度测试，完成后自动删除。运行：" + $run_url),
              draft:false,
              prerelease:true,
              make_latest:"false"
            }' > "$work_dir/create-release.json"
          request POST \
            "$API_REPO/-/releases" \
            201 \
            "$work_dir/create-release-response.json" \
            "$work_dir/create-release.json"
          release_id="$(jq -er '.id' "$work_dir/create-release-response.json")"
          echo "已创建 CNB 测试 Release：$TEST_RELEASE_TAG"

          upload_rows="$work_dir/upload-rows.tsv"
          : > "$upload_rows"
          index=0
          while IFS= read -r asset_name; do
            index=$((index + 1))
            asset_path="$ASSET_DIR/$asset_name"
            asset_size="$(stat --format='%s' "$asset_path")"
            jq -n \
              --arg asset_name "$asset_name" \
              --argjson size "$asset_size" \
              '{asset_name:$asset_name,size:$size,overwrite:true,ttl:0}' \
              > "$work_dir/upload-request-$index.json"
            request POST \
              "$API_REPO/-/releases/$release_id/asset-upload-url" \
              201 \
              "$work_dir/upload-response-$index.json" \
              "$work_dir/upload-request-$index.json"
            upload_url="$(jq -er '.upload_url' "$work_dir/upload-response-$index.json")"
            verify_url="$(jq -er '.verify_url' "$work_dir/upload-response-$index.json")"
            if [[ "$verify_url" != http://* && "$verify_url" != https://* ]]; then
              verify_url="$CNB_API_URL$verify_url"
            fi
            if [[ "$verify_url" == *\?* ]]; then
              verify_url="${verify_url}&ttl=0"
            else
              verify_url="${verify_url}?ttl=0"
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$index" "$asset_name" "$asset_path" "$asset_size" "$upload_url" "$verify_url" \
              >> "$upload_rows"
          done < "$ASSET_LIST"

          upload_one() {
            local index="$1"
            local asset_name="$2"
            local asset_path="$3"
            local asset_size="$4"
            local upload_url="$5"
            local verify_url="$6"
            local started_at finished_at elapsed status metrics verify_status

            started_at="$(date +%s)"
            echo "[$(date --iso-8601=seconds)] 开始上传：$asset_name"
            metrics="$(curl --fail-with-body --silent --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 30 \
              --speed-limit 10240 \
              --speed-time 120 \
              --request PUT \
              --upload-file "$asset_path" \
              --output "$work_dir/upload-body-$index.txt" \
              --write-out '%{http_code}\t%{time_total}\t%{speed_upload}' \
              "$upload_url")"
            IFS=$'\t' read -r status _ _ <<< "$metrics"
            case "$status" in
              200|201|204) ;;
              *)
                echo "上传失败：$asset_name（HTTP $status）" >&2
                return 1
                ;;
            esac

            verify_status="$(curl --silent --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 30 \
              --request POST \
              --header "$AUTH_HEADER" \
              --header "$ACCEPT_HEADER" \
              --output "$work_dir/verify-response-$index.json" \
              --write-out '%{http_code}' \
              "$verify_url")"
            if [ "$verify_status" != 200 ]; then
              echo "校验失败：$asset_name（HTTP $verify_status）" >&2
              return 1
            fi

            finished_at="$(date +%s)"
            elapsed=$((finished_at - started_at))
            printf '%s\t%s\t%s\t%s\n' \
              "$asset_name" "$asset_size" "$elapsed" "$metrics" \
              > "$work_dir/result-$index.tsv"
            echo "[$(date --iso-8601=seconds)] 完成上传：$asset_name（${elapsed} 秒）"
          }

          wall_started_at="$(date +%s)"
          pids=()
          while IFS=$'\t' read -r index asset_name asset_path asset_size upload_url verify_url; do
            upload_one \
              "$index" "$asset_name" "$asset_path" "$asset_size" "$upload_url" "$verify_url" &
            pids+=("$!")
          done < "$upload_rows"

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done
          wall_finished_at="$(date +%s)"
          wall_elapsed=$((wall_finished_at - wall_started_at))

          if [ "$failed" -ne 0 ]; then
            echo "至少一个并行上传任务失败。" >&2
            exit 1
          fi

          {
            echo '## CNB 三路并行上传结果'
            echo
            echo '| 附件 | 大小 | 单连接耗时 | 单连接速度 |'
            echo '|---|---:|---:|---:|'
          } >> "$GITHUB_STEP_SUMMARY"

          total_bytes=0
          for result_file in "$work_dir"/result-*.tsv; do
            IFS=$'\t' read -r asset_name asset_size elapsed status transfer_seconds speed_upload \
              < "$result_file"
            total_bytes=$((total_bytes + asset_size))
            awk \
              -v name="$asset_name" \
              -v bytes="$asset_size" \
              -v elapsed="$elapsed" \
              -v speed="$speed_upload" \
              'BEGIN {
                printf "| `%s` | %.1f MiB | %d:%02d | %.3f MiB/s |\n",
                  name, bytes / 1048576, int(elapsed / 60), elapsed % 60, speed / 1048576
              }' >> "$GITHUB_STEP_SUMMARY"
          done

          awk \
            -v bytes="$total_bytes" \
            -v elapsed="$wall_elapsed" \
            'BEGIN {
              printf "\n- 并行总耗时：%d:%02d\n", int(elapsed / 60), elapsed % 60
              printf "- 聚合上传速度：%.3f MiB/s（%.2f Mbit/s）\n",
                bytes / 1048576 / elapsed, bytes / 1048576 / elapsed * 8
            }' | tee -a "$GITHUB_STEP_SUMMARY"

          delete_release
          release_id=''
